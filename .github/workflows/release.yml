name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make cross
